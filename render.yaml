services:
  - type: web
    name: autonomous-car-detection
    env: python
    buildCommand: pip install -r requirements_render.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PATH
        value: yolov11s_final.pt
      - key: PREDICTION_LOG_DIR
        value: ./prediction_logs
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MLFLOW_TRACKING_URI
        sync: false  # Set this in Render dashboard
      - key: DATABRICKS_TOKEN
        sync: false  # Set this in Render dashboard (sensitive)

